interface:
  display_name: "使用 ImageForge MCP"
  short_description: "调用 gpt-image-2 完成生图、参考图生成、图片编辑与本地保存"
  default_prompt: "使用 $use-imageforge-mcp 生成或编辑图片，并将结果保存到指定位置。"

dependencies:
  tools:
    - type: "mcp"
      value: "image_generate"
      description: "Local ImageForge MCP server providing generate_image and edit_image"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
